name: Esegui PEC Intake Cloud

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  run-pec-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui lo script tramite adattatore Cloud
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEC_USER: ${{ secrets.PEC_USER }}
          PEC_PASSWORD: ${{ secrets.PEC_PASSWORD }}
          PEC_IMAP_SERVER: ${{ secrets.PEC_IMAP_SERVER }}
        run: python run_cloud.py --dal 2026-09-01
