name: Esegui lo script
  env:
    SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    PEC_USER: ${{ secrets.PEC_USER }}
    PEC_PASSWORD: ${{ secrets.PEC_PASSWORD }}
    PEC_IMAP_SERVER: ${{ secrets.PEC_IMAP_SERVER }}
  run: python pec_intake.py

on:
  schedule:
    # Esegue il job ogni 2 ore (allo scatto dell'ora)
    - cron: '0 */2 * * *'
  # Permette di avviare manualmente il workflow per test
  workflow_dispatch:

jobs:
  run-pec-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Limita la durata per evitare consumi eccessivi

    steps:
      # 1. Scarica il codice del tuo repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Prepara Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. (Opzionale) Cache delle dipendenze per velocizzare le esecuzioni
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # 4. Installa le dipendenze del tuo script
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Esegue il tuo script
      - name: Run pec_intake.py
        env:
          # Qui passi i segreti come variabili d'ambiente
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: python pec_intake.py
